<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Curriculum Onboarding Visual</title>
<style>
  :root{
    color-scheme: light;
    --ink:#1F1F1F; --muted:#6B6B6B; --line:#BDBDBD; --soft:#E6E6E6; --fill:#F2F2F2; --page:#FAFAFA; --card:#FFFFFF;
    --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; }
  button, input{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px dashed var(--ink); outline-offset:2px; }
  h1,h2,h3{ font-weight:600; text-wrap:balance; margin:0; }
  .muted{ color:var(--muted); }
  .small{ font-size:13px; color:var(--muted); }
  .mono{ font-family:var(--mono); font-size:12px; letter-spacing:.04em; }

  /* ---------- prototype chrome ---------- */
  .proto{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:50; background:#2B2B2B; color:#DDD; padding-inline:16px; padding-block:8px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:12.5px; }
  .proto b{ color:#fff; }
  @media (max-width:640px){ .proto{ position:static; } .bar .muted{ display:none; } }
  .rail{ display:flex; flex-wrap:wrap; gap:4px; }
  .rail button{ border:1px solid #555; background:#3A3A3A; color:#DDD; border-radius:4px; padding:3px 8px; font-size:12px; }
  .rail button[aria-current="step"]{ background:#fff; color:#111; border-color:#fff; }
  .proto .sp{ flex:1; }
  .proto label{ display:flex; gap:6px; align-items:center; cursor:pointer; }
  .note{ max-width:1080px; margin:12px auto 0; padding-inline:16px; }
  .note div{ border:1px dashed #999; background:#FFFFF0; padding:10px 14px; font-size:13.5px; border-radius:4px; }

  /* ---------- wireframe primitives ---------- */
  .wrap{ max-width:1080px; margin:0 auto; padding-inline:16px; }
  .bar{ border-bottom:1px solid var(--line); background:var(--card); }
  .bar .wrap{ height:56px; display:flex; align-items:center; gap:14px; }
  .ph{ border:1px solid var(--line); background:
      linear-gradient(to top right, transparent calc(50% - .5px), var(--line) 50%, transparent calc(50% + .5px)),
      linear-gradient(to top left, transparent calc(50% - .5px), var(--line) 50%, transparent calc(50% + .5px)), var(--fill);
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; text-align:center; }
  .ph span{ background:var(--fill); padding:2px 8px; border-radius:3px; }
  .logo{ width:96px; height:28px; }
  .sp{ flex:1; }
  .pill{ border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:13px; background:var(--card); }
  .box{ border:1px solid var(--line); background:var(--card); border-radius:6px; padding:20px; }
  .box + .box{ margin-top:14px; }
  .btn{ border:1px solid var(--ink); border-radius:6px; padding:10px 16px; font-weight:600; background:var(--card); }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .link{ background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  .grid4{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  @media (max-width:760px){ .grid2, .grid3, .grid4{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:13px; font-weight:600; }
  .field input{ border:1px solid var(--line); border-radius:4px; padding:9px 10px; background:#fff; }
  .field.bad input{ border-color:var(--ink); border-width:2px; }
  .field .err{ font-size:12.5px; }
  .sublabel{ font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
  .progress{ height:8px; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:#fff; }
  .progress i{ display:block; height:100%; width:0; background:#9E9E9E; transition:width .25s; }
  .opt{ text-align:left; border:1px solid var(--line); border-radius:6px; background:#fff; padding:12px 14px; }
  .opt[aria-pressed="true"]{ border:2px solid var(--ink); padding:11px 13px; }
  .opt b{ display:block; }
  .opt:disabled{ cursor:default; }
  .tag{ font-size:11px; border:1px solid var(--ink); border-radius:3px; padding:0 5px; margin-left:6px; font-weight:600; }
  ul.clean{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  ul.clean li{ border:1px solid var(--soft); border-radius:4px; padding:7px 10px; background:#fff; display:flex; justify-content:space-between; gap:10px; }

  /* ---------- 1. home ---------- */
  .home{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-block:clamp(48px, 12vh, 120px); }
  .home h1{ font-size:clamp(30px, 4.6vw, 48px); line-height:1.1; margin:6px 0 12px; }
  /* ---------- motion hero ---------- */
  .hero-sec{ position:relative; overflow:hidden; min-height:calc(100vh - 150px); display:flex; align-items:center; }
  .hero-sec .home{ position:relative; z-index:1; width:100%; }
  .hero-sec #hero-col{ width:min(100%, 680px); }
  #fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .hero-sec.intro{ cursor:pointer; }
  .w{ display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:.1em; margin-bottom:-.1em; position:relative; }
  .w > span{ display:inline-block; transform-origin:0 100%; }
  .w .ul{ position:absolute; left:0; right:0; bottom:.02em; height:.07em; background:currentColor; transform-origin:left; }
  .skip{ position:absolute; right:16px; bottom:16px; z-index:2; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-size:13px; }
  .pbtn{ border:1px solid #777; background:#3A3A3A; color:#fff; border-radius:4px; padding:3px 8px; font-size:12px; }
  .hero-sec .upload{ border:0; background:
      linear-gradient(90deg, var(--ink) 50%, transparent 0) repeat-x 0 0 / 14px 2px,
      linear-gradient(90deg, var(--ink) 50%, transparent 0) repeat-x 0 100% / 14px 2px,
      linear-gradient(0deg, var(--ink) 50%, transparent 0) repeat-y 0 0 / 2px 14px,
      linear-gradient(0deg, var(--ink) 50%, transparent 0) repeat-y 100% 0 / 2px 14px, #fff;
    animation:ants 1.2s linear infinite; transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .hero-sec .upload:hover{ transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.08); }
  .hero-sec .upload .ic span{ display:inline-block; animation:bob 1.6s ease-in-out infinite; }
  @keyframes ants{ to{ background-position:14px 0, -14px 100%, 0 -14px, 100% 14px, 0 0; } }
  @keyframes bob{ 50%{ transform:translateY(-4px); } }
  @media (prefers-reduced-motion: reduce){ .hero-sec .upload, .hero-sec .upload .ic span{ animation:none; } }
  .home > div{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .home h1{ max-width:18ch; }
  .home p{ max-width:46ch; margin:0 0 22px; }
  .upload{ width:100%; max-width:480px; display:flex; gap:14px; align-items:center; text-align:left; border:2px dashed var(--ink); border-radius:8px; padding:18px; background:#fff; position:relative; cursor:pointer; }
  .upload.over{ background:var(--soft); }
  .upload input{ position:absolute; width:1px; height:1px; opacity:0; }
  .upload .ic{ width:44px; height:44px; flex:0 0 auto; }

  /* ---------- 2. workspace ---------- */
  .ws{ padding-block:20px 48px; }
  .ws .actions{ justify-content:flex-start; }
  .stepper{ border:1px solid var(--line); border-radius:6px; padding:10px; background:#fff; display:flex; flex-direction:column; gap:6px; }
  .stepper label{ font-size:13px; font-weight:600; }
  .ctl{ display:flex; align-items:center; gap:6px; }
  .ctl button{ width:30px; height:30px; border:1px solid var(--ink); border-radius:4px; background:#fff; flex:0 0 auto; }
  .ctl input{ width:100%; min-width:0; text-align:center; border:0; border-bottom:1px solid var(--line); font-size:20px; background:transparent; }
  .sum{ margin-top:12px; border:1px solid var(--ink); border-radius:6px; padding:12px 14px; background:#fff; }
  .lrow{ display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:center; border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#fff; }
  .lrow .n{ width:26px; height:26px; border:1px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .lrow.done .n{ background:var(--ink); color:#fff; }

  /* ---------- 3. review / 4. unlock / 5. build ---------- */
  .rv{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; align-items:start; }
  .rv .box + .box{ margin-top:0; }
  @media (max-width:860px){ .rv{ grid-template-columns:1fr; } }
  .doc h4{ margin:16px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .doc ul{ margin:0; padding-left:18px; }
  .changed{ border:1px dashed var(--ink); border-radius:4px; padding:6px 10px; font-size:13px; margin-bottom:12px; background:var(--fill); }
  .chk{ display:flex; flex-direction:column; gap:6px; }
  .chk label{ display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:4px; padding:7px 10px; background:#fff; cursor:pointer; }
  .field textarea{ border:1px solid var(--line); border-radius:4px; padding:9px 10px; font:inherit; resize:vertical; }
  .field.bad textarea{ border:2px solid var(--ink); }
  .toc details{ border:1px solid var(--line); border-radius:6px; background:#fff; }
  .toc details + details{ margin-top:6px; }
  .toc summary{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 12px; cursor:pointer; }
  .toc ul{ margin:0; padding:0 12px 12px 32px; }
  .scan{ margin-bottom:16px; }
  .unit-in{ animation:unitIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes unitIn{ from{ opacity:0; transform:translateY(8px); } }
  @media (prefers-reduced-motion: reduce){ .unit-in{ animation:none; } }
  .confirm{ margin-top:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--tint, #F2F2F2); }
  .fixrow{ display:grid; grid-template-columns:60px minmax(0,1fr) 90px 38px; gap:8px; align-items:center; }
  .fixrow + .fixrow{ margin-top:8px; }
  .fixhead{ font-weight:600; }
  @media (max-width:560px){ .fixhead{ display:none; } }
  .fixrow input{ border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; min-width:0; }
  .fixrow input.bad{ border-color:var(--danger, #DC2828); }
  .iconbtn{ width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--muted); font-size:18px; line-height:1; }
  .iconbtn:hover{ color:var(--danger, #DC2828); border-color:currentColor; }
  .addu{ margin-top:12px; border-style:dashed; }
  @media (max-width:560px){ .fixrow{ grid-template-columns:minmax(0,1fr) 72px 38px; } .fixn{ grid-column:1 / -1; } }

  /* ---------- Host peeking over the upload box ---------- */
  .drop-wrap{ position:relative; width:100%; max-width:480px; }
  .drop-wrap .upload{ z-index:1; max-width:none; }
  .hero-sec .home p{ margin-bottom:34px; }
  @media (max-width:720px){ .hero-sec .home p{ margin-bottom:70px; } }
  .host-clip{ position:absolute; right:6px; bottom:calc(100% - 20px); width:100px; height:112px; overflow:hidden; z-index:0; pointer-events:none; }
  .host{ position:absolute; left:0; bottom:0; width:100px; transform:translateY(100%); transition:transform .75s cubic-bezier(.34,1.56,.64,1); }
  .host svg{ display:block; overflow:visible; }
  .host.up{ transform:translateY(26px); }
  .host.up.hi{ transform:translateY(10px); }
  .host.up svg{ animation:hostbob 3.2s ease-in-out .8s infinite; }
  .host .eyes{ transform-box:fill-box; transform-origin:center; transition:transform .09s; }
  .host.blink .eyes{ transform:scaleY(.1); }
  .host .pupil{ transition:transform .12s ease-out; }
  .host .m-open{ display:none; } .host.hi .m-open{ display:inline; } .host.hi .m-smile{ display:none; }
  .host .brows{ transition:transform .2s; } .host.hi .brows{ transform:translateY(-3px); }
  .host-hands{ position:absolute; right:6px; top:-11px; width:100px; height:20px; z-index:2; pointer-events:none; transform:translateY(10px) scaleY(0); transform-origin:bottom; opacity:0;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1) .35s, opacity .2s .35s; }
  .host-hands.up{ transform:none; opacity:1; }
  @keyframes hostbob{ 50%{ transform:translateY(3px); } }
  @media (max-width:560px){ .host-clip, .host-hands{ right:18px; } }
  @media (prefers-reduced-motion: reduce){ .host, .host-hands{ transition:none; } }

  /* ---------- Square reading the book on step 2a ---------- */
  .track{ position:relative; padding-top:78px; margin-top:4px; }
  .reader{ position:absolute; bottom:6px; right:-4px; width:82px; }   /* parked at the end of the bar: the fill runs toward Square */
  .reader svg{ display:block; overflow:visible; animation:lean 1.6s ease-in-out infinite; transform-origin:50% 100%; }
  .reader .f-done, .reader .check{ display:none; }
  .reader .h1{ animation:type .28s ease-in-out infinite alternate; }
  .reader .h2{ animation:type .28s ease-in-out -.14s infinite alternate; }
  .reader .keys{ animation:keys .56s steps(2) infinite; }
  @keyframes type{ to{ transform:translateY(3px); } }
  @keyframes keys{ 50%{ opacity:0; } }
  @keyframes lean{ 50%{ transform:rotate(-2deg) translateY(1px); } }
  .reader.done .f-busy, .reader.done .keys{ display:none; }
  .reader.done .f-done{ display:inline; }
  .reader.done .h1, .reader.done .h2{ animation:none; }
  .reader.done svg{ animation:hop .5s cubic-bezier(.34,1.56,.64,1); }
  .reader.done .check{ display:inline; transform-box:fill-box; transform-origin:center; animation:pop .45s cubic-bezier(.34,1.56,.64,1) .15s both; }
  @keyframes hop{ 40%{ transform:translateY(-10px); } }
  @keyframes pop{ from{ transform:scale(0); } }
  @media (prefers-reduced-motion: reduce){ .reader, .reader *{ animation:none !important; transition:none !important; } }

  /* ---------- chat with Square ---------- */
  .host svg rect, .reader svg{ pointer-events:auto; cursor:pointer; }
  .host-clip{ pointer-events:none; }
  .chat{ position:fixed; right:20px; bottom:20px; z-index:90; width:min(370px, calc(100vw - 32px)); height:min(520px, calc(100vh - 40px)); display:flex; flex-direction:column;
    background:#fff; border-radius:20px; box-shadow:0 24px 64px -12px hsl(225 73% 20% / .30), 0 0 0 1px var(--line); overflow:hidden; transform-origin:100% 100%; }
  .chat-head{ display:flex; gap:10px; align-items:center; padding:14px 14px 12px 16px; border-bottom:1px solid var(--line); }
  .chat-head b{ color:var(--primary); }
  .chat-x{ width:34px; height:34px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--primary); font-size:18px; }
  .chat-log{ flex:1; overflow-y:auto; padding:14px 14px 6px; display:flex; flex-direction:column; gap:8px; background:var(--page); }
  .msg{ max-width:82%; padding:9px 12px; border-radius:16px; line-height:1.4; font-size:14.5px; animation:msgIn .3s cubic-bezier(.2,.8,.2,1) both; }
  .msg.sq{ align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px; }
  .msg.me{ align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:6px; }
  .typing{ display:inline-flex; gap:4px; } .typing i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:dot 1s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes dot{ 30%{ transform:translateY(-4px); opacity:.5; } }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(6px); } }
  .chat-chips{ display:flex; gap:6px; flex-wrap:wrap; padding:8px 14px 0; background:var(--page); }
  .chat-chips:empty{ display:none; }
  .chat-chips button{ border:1px solid var(--line); background:#fff; color:var(--primary); border-radius:999px; padding:5px 11px; font-size:13px; }
  .chat-chips button:hover{ border-color:var(--primary); background:var(--tint); }
  .chat-form{ display:flex; gap:8px; padding:10px 12px 12px; background:var(--page); }
  .chat-form input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; }
  .chat-form input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--tint); }
  .chat-send{ width:42px; border:0; border-radius:12px; background:var(--primary); color:#fff; font-size:18px; font-weight:600; }
  @media (max-width:560px){ .chat{ right:8px; left:8px; bottom:8px; width:auto; height:min(560px, calc(100vh - 80px)); } }
  @media (prefers-reduced-motion: reduce){ .msg, .typing i{ animation:none; } }

  @keyframes sideblink{ 0%, 95%, 100%{ transform:none; } 97%{ transform:scaleY(.1); } }
  /* only where there is room beside the card */
  @media (prefers-reduced-motion: reduce){ .side-sq, .side-hand{ transition:none; } .side-sq svg, .side-sq .eyes{ animation:none; } }

  /* ---------- Square beside the CTA, pointing at it (2c, 2d) ---------- */
  .actions{ align-items:center; }
  .cta-buddy{ display:inline-block; margin-left:2px; line-height:0; }
  .cta-buddy svg{ display:block; overflow:visible; cursor:pointer; animation:budIn .6s cubic-bezier(.34,1.56,.64,1) both; }
  .cta-buddy .arm{ animation:poke 1.1s ease-in-out .6s infinite; }
  .cta-buddy .bod{ animation:budbob 2.2s ease-in-out .6s infinite; }
  .cta-buddy .ey{ transform-box:fill-box; transform-origin:center; animation:sideblink 4.2s infinite; }
  .cta-buddy .mo2{ display:none; }
  .actions:has(.btn.primary:hover) .cta-buddy .mo{ display:none; }
  .actions:has(.btn.primary:hover) .cta-buddy .mo2{ display:inline; }
  .actions:has(.btn.primary:hover) .cta-buddy svg{ animation:cheer .5s ease-in-out infinite alternate; }
  @media (max-width:1260px){ .actions:has(.cta-buddy) .btn.primary{ animation:ctapulse 2.8s ease-out 1.2s infinite; } }
  @keyframes budIn{ from{ opacity:0; transform:translateX(24px) scale(.7); } }
  @keyframes poke{ 0%, 60%, 100%{ transform:none; } 30%{ transform:translateX(-7px); } }
  @keyframes budbob{ 50%{ transform:translateY(-2px); } }
  @keyframes cheer{ to{ transform:translateY(-6px) rotate(-4deg); } }
  @keyframes ctapulse{ 0%{ box-shadow:0 0 0 0 hsl(15 85% 60% / .45); } 70%, 100%{ box-shadow:0 0 0 14px hsl(15 85% 60% / 0); } }
  @media (prefers-reduced-motion: reduce){ .cta-buddy svg, .cta-buddy .arm, .cta-buddy .bod, .cta-buddy .ey, .actions:has(.cta-buddy) .btn.primary{ animation:none !important; } }

  /* ---------- Square peeking from the card's LEFT edge, level with the CTA (2c, 2d) ---------- */
  .ws{ position:relative; }
  .ws > .box:first-child{ position:relative; z-index:1; }
  .lpeek{ position:absolute; left:calc(16px - 86px); top:0; width:112px; height:120px; z-index:0; pointer-events:none; }
  .lpeek-clip{ position:absolute; inset:0; overflow:hidden; }
  .lpeek-sq{ position:absolute; left:0; top:14px; transform:translateX(110%); transform-origin:100% 50%; transition:transform .7s cubic-bezier(.34,1.56,.64,1); }
  .lpeek-sq svg{ display:block; pointer-events:auto; cursor:pointer; }
  .lpeek.out .lpeek-sq{ transform:translateX(26px) rotate(-12deg); }
  .lpeek.out .lpeek-sq svg{ animation:lpbob 3.4s ease-in-out .9s infinite; }
  .lpeek-sq .eyes{ transform-box:fill-box; transform-origin:center; animation:sideblink 4.6s infinite; }
  .lpeek-hand{ position:absolute; left:72px; top:49px; z-index:2; opacity:0; transform:translateX(-12px); transition:opacity .2s .45s, transform .35s cubic-bezier(.34,1.56,.64,1) .45s; }
  .lpeek.out .lpeek-hand{ opacity:1; transform:none; animation:lppoke 1.2s ease-in-out 1.1s infinite; }
  @keyframes lpbob{ 50%{ transform:translateX(-3px) rotate(2deg); } }
  @keyframes lppoke{ 0%, 60%, 100%{ transform:none; } 30%{ transform:translateX(5px); } }
  .ws.peek-on .actions .btn.primary{ animation:ctapulse 2.8s ease-out 1.2s infinite; }
  /* side peek where there is room beside the card; the standing buddy next to the button on narrower screens */
  @media (min-width:1261px){ .cta-buddy{ display:none; } }
  @media (max-width:1260px){ .lpeek{ display:none; } }
  @media (prefers-reduced-motion: reduce){ .lpeek-sq, .lpeek-hand{ transition:none; } .lpeek-sq svg, .lpeek-sq .eyes, .lpeek-hand, .ws.peek-on .actions .btn.primary{ animation:none !important; } }
  .proto select{ font-size:12px; border-radius:4px; padding:2px 4px; }
  .savebar{ margin-top:16px; border:2px solid var(--ink); border-radius:6px; padding:14px 16px; background:#fff; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .qrow{ display:grid; grid-template-columns:minmax(0,1fr) 160px 70px; gap:12px; align-items:center; font-size:14px; }
  .qrow span{ text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }

  .modal{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; padding:16px; }
  .sheet{ background:#fff; border:1px solid var(--ink); border-radius:8px; width:min(600px, 100%); max-height:88vh; overflow:auto; padding:22px 24px; position:relative; }
  .sheet .x{ position:absolute; top:10px; right:10px; width:32px; height:32px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .sheet h4{ margin:16px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .sheet ul{ margin:0; padding-left:18px; }

  /* ---------- Rumi product theme (tokens from the Rumi website design system) ---------- */
  :root{
    --primary:#0E2058;            /* hsl(225 73% 20%) brand navy */
    --primary-hover:#1A3180;
    --accent:#F06E42;             /* hsl(15 85% 60%) coral: the one warm accent */
    --accent-tint:#FEF0EA;
    --fg:#1D2025;                 /* hsl(220 13% 13%) */
    --muted:#6B7280;              /* hsl(220 9% 46%) */
    --line:#E5E7EB;               /* hsl(220 13% 91%) */
    --fill:#F4F4F6;               /* hsl(220 10% 96%) */
    --soft:#EEF1F6;
    --tint:#EEF2FB;               /* navy at low strength, for selected states */
    --page:#F9FAFB; --card:#FFFFFF;
    --ink:var(--primary);
    --danger:#DC2828;
    --radius:16px;
    --shadow-soft:0 4px 24px -4px hsl(220 13% 13% / .06);
    --shadow-medium:0 12px 48px -8px hsl(220 13% 13% / .10);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  body{ color:var(--fg); background:var(--page); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  h1,h2,h3{ color:var(--primary); }
  h1,h2,h3, .brand{ font-family:var(--display); }
  h1,h2{ font-weight:800; letter-spacing:-.02em; }
  h3{ font-weight:700; letter-spacing:-.01em; }
  .home h1{ font-weight:800; letter-spacing:-.025em; }
  .home .mono{ color:var(--accent); font-weight:600; letter-spacing:.12em; }
  .w .ul{ background:var(--accent); }
  .bar{ background:var(--card); border-bottom-color:var(--line); }
  .brand{ display:inline-flex; align-items:center; gap:9px; color:var(--primary); font-weight:600; font-size:19px; letter-spacing:-.01em; }
  .brand img{ height:20px; width:auto; display:block; }
  .brand-sep{ width:1px; height:22px; background:var(--line); }
  .pill{ border-color:var(--line); color:var(--primary); }
  .link{ color:var(--primary); }
  .box{ border-color:var(--line); border-radius:var(--radius); box-shadow:var(--shadow-soft); }
  .btn{ border-radius:12px; border-color:var(--primary); color:var(--primary); transition:background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease); }
  .btn:hover:not(:disabled){ background:var(--tint); }
  .btn.primary{ background:var(--primary); color:#fff; }
  .btn.primary:hover:not(:disabled){ background:var(--primary-hover); box-shadow:var(--shadow-soft); }
  .field label{ color:var(--fg); }
  .field input, .field textarea{ border-color:var(--line); border-radius:10px; transition:border-color .2s, box-shadow .2s; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--tint); }
  .field.bad input, .field.bad textarea{ border:1px solid var(--danger); box-shadow:0 0 0 3px #FDECEC; }
  .field .err{ color:var(--danger); }
  .progress{ border:0; background:var(--fill); }
  .progress i{ background:var(--accent); }
  .opt{ border-color:var(--line); border-radius:12px; transition:border-color .2s, background .2s; }
  .opt:hover{ border-color:#C9D2E6; }
  .opt[aria-pressed="true"]{ border-color:var(--primary); background:var(--tint); }
  .tag{ background:var(--accent); border-color:var(--accent); color:#fff; border-radius:999px; padding:1px 8px; }
  ul.clean li{ border-color:var(--line); border-radius:10px; }
  .stepper{ border-color:var(--line); border-radius:12px; }
  .ctl button{ border-color:var(--line); border-radius:8px; color:var(--primary); }
  .ctl button:hover{ background:var(--tint); }
  .ctl input{ color:var(--primary); }
  .sum{ border:0; background:var(--tint); border-radius:12px; }
  .lrow{ border-color:var(--line); border-radius:12px; }
  .lrow .n{ border-color:var(--primary); color:var(--primary); }
  .lrow.done .n{ background:var(--primary); color:#fff; }
  .changed{ border:0; border-left:3px solid var(--accent); background:var(--accent-tint); border-radius:8px; }
  .chk label{ border-color:var(--line); border-radius:10px; }
  .toc details{ border-color:var(--line); border-radius:12px; }
  .toc details[open]{ box-shadow:var(--shadow-soft); }
  .savebar{ border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-medium); }
  .modal{ background:hsl(225 73% 20% / .35); }
  .sheet{ border:0; border-radius:20px; box-shadow:var(--shadow-medium); }
  .sheet .x{ border-color:var(--line); border-radius:10px; color:var(--primary); }
  .skip{ border-color:var(--line); color:var(--primary); }
  .upload{ border-radius:var(--radius); }
  .hero-sec .upload:hover{ box-shadow:var(--shadow-medium); }
  .upload .ic{ background:var(--tint); border:0; border-radius:12px; color:var(--primary); font-size:20px; font-weight:600; }
  .upload .ic span{ background:transparent; }
  .hero-sec .upload{ background:#fff; animation:none; }
  .upload .ants{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .upload .ants rect{ width:calc(100% - 2px); height:calc(100% - 2px); fill:none; stroke:var(--primary); stroke-width:2; stroke-dasharray:8 6; animation:antsvg 1.1s linear infinite; }
  .upload:hover .ants rect, .upload.over .ants rect{ stroke:var(--accent); }
  @keyframes antsvg{ to{ stroke-dashoffset:-14; } }
  @media (prefers-reduced-motion: reduce){ .upload .ants rect{ animation:none; } }
</style>

cx="89" cy="79" rx="7" ry="3.8" fill="#fff" stroke="#111" stroke-width="2.2"/></g></svg></span></div>';

      var b = el("div", "stepper", '<label for="tt-' + f[0] + '">' + f[1] + '</label><div class="ctl"><button type="button" aria-label="Less">−</button><input id="tt-' + f[0] + '" inputmode="numeric" value="' + S.tt[f[0]] + '"><span class="small">' + f[5] + '</span><button type="button" aria-label="More">+</button></div>');
      var inp = b.querySelector("input"), bs = b.querySelectorAll("button");

      bs[0].addEventListener("click", function(){ set(S.tt[f[0]] - f[4]); });

      inp.addEventListener("change", function(){ set(inp.value); });
      $("#tt").appendChild(b);
    });
    function paint(){
      var b = budget(), fit = b.periods >= BOOK_NEED * 1.25 ? "Plenty of room: we’ll add practice days to fill it."
        : b.periods >= BOOK_NEED ? "A good fit, with a little room for practice." : "Tight: we’ll combine the shortest lessons so the whole book fits.";
      $("#sum").innerHTML = "<b>" + b.weeks + "</b> teaching weeks × <b>" + S.tt.perWeek + "</b> periods = <b>" + b.periods + " lessons a year</b>, " + S.tt.minutes + " min each.<br><span class=\"small\">The book needs about " + BOOK_NEED + " (content + a revision and an assessment day per unit). " + fit + "</span>";
    }

  }

  function difficulty(){
    mark("2d"); head("Step 2d · must ask", "How challenging should the lessons be?");
    var g = el("div", "grid2");
    Object.keys(LEVELS).forEach(function(k){
      var L = LEVELS[k], b = el("button", "opt", "<b>" + L.t + (L.rec ? '<span class="tag">Recommended</span>' : "") + '</b><span class="small">' + L.d + "</span>");

    });
    var body = $("#ws-body"); body.innerHTML = '<div class="small" style="margin-bottom:12px">Used for every lesson in this book.</div>'; body.appendChild(g);
    body.appendChild(el("div", "actions", '<button type="button" class="btn primary" id="lv-ok">Continue</button><span class="cta-buddy" aria-hidden="true"><svg viewBox="0 0 112 84" width="104" height="78"><g class="arm"><path d="M 54 46 L 20 46" stroke="#111" stroke-width="9" stroke-linecap="round"/><path d="M 54 46 L 20 46" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><circle cx="16" cy="46" r="6.4" fill="#fff" stroke="#111" stroke-width="2.4"/><path d="M 12 43.5 L 2 43.5" stroke="#111" stroke-width="7" stroke-linecap="round"/><path d="M 12 43.5 L 2 43.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><g class="bod"><rect x="52" y="14" width="50" height="50" rx="6" fill="#EC6252" stroke="#EC6252" stroke-width="9" stroke-linejoin="round"/><path class="br" d="M 60 28 Q 65 24 70 28 M 78 28 Q 83 24 88 28" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/><g class="ey"><circle cx="60.5" cy="38" r="4" fill="#111"/><circle cx="61.8" cy="36.6" r="1.3" fill="#fff"/><circle cx="78.5" cy="38" r="4" fill="#111"/><circle cx="79.8" cy="36.6" r="1.3" fill="#fff"/></g><path class="mo" d="M 67 49 Q 73 55 79 49" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/><path class="mo2" d="M 66 48 Q 73 59 80 48 Z" fill="#3A1010" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="94" cy="47" rx="4.5" ry="2.6" fill="#FF7FA0" opacity=".6"/><path d="M 68 64 L 68 76 M 86 64 L 86 76" stroke="#111" stroke-width="8" stroke-linecap="round"/><path d="M 68 64 L 68 76 M 86 64 L 86 76" stroke="#fff" stroke-width="3" stroke-linecap="round"/><ellipse cx="65" cy="79" rx="7" ry="3.8" fill="#fff" stroke="#111" stroke-width="2.2"/><ellipse cx="89" cy="79" rx="7" ry="3.8" fill="#fff" stroke="#111" stroke-width="2.2"/></g></svg></span>'));
    $("#lv-ok").addEventListener("click", build);
    peekAt(true);
  }
  function choose(k){
    S.level = k;
    [].forEach.call(document.querySelectorAll(".opt"), function(b, i){ b.setAttribute("aria-pressed", String(Object.keys(LEVELS)[i] === k)); });
  }

  // ---------- 2e · build the first lesson ----------
  var FIRST = UNITS[0].L[0];
  function build(){
    mark("2e"); ws(); head("Step 2e", "Building your first lesson");
    var body = $("#ws-body");
    body.innerHTML = '<div class="small" style="margin-bottom:10px">Unit 1 · Day 1, the first lesson in the book. We build this one first so you can check it before we do the rest. Leave any time; we’ll email you when it’s ready.</div>' +
      '<div class="scan"><div class="row"><span class="small" id="st0">Starting\u2026</span><span class="sp"></span><span class="small" id="stn"></span></div>' +
      '<div class="track">' + readerSVG("builder") + '<div class="progress"><i id="lb0"></i></div></div></div>' +
      '<div class="lrow lrow2"><div class="n">1</div><div><b>' + esc(FIRST[0]) + '</b><div class="small">Unit 1 \u00b7 Day 1 \u00b7 ' + esc(FIRST[1]) + (FIRST[2] ? ' \u00b7 ' + esc(FIRST[2]) : '') + '</div></div><span class="pill" id="lstate">In progress</span></div>';
    var STAGES = [["Page-Truth","Reading pages"],["Segment","Planning the day"],["Validate","Checking outcomes"],["Enrich","Solving exercises"],["Slide-Script","Writing the lesson"],["Render","Designing pages"]];
    var k = 0;
    function prog(p, label){
      $("#lb0").style.width = Math.min(1, p) * 100 + "%";
      $("#st0").innerHTML = p >= 1 ? "<b>Done.</b> Your first lesson is ready." : label + "\u2026";
      $("#stn").textContent = p >= 1 ? "" : "Step " + Math.min(STAGES.length, k + 1) + " of " + STAGES.length;
      if (p >= 1){ $(".lrow2").classList.add("done"); $("#lstate").textContent = "Ready"; $("#builder").classList.add("done"); }
    }
    (function next(){
      if (k === STAGES.length){ prog(1, ""); built(); return; }
      var s = STAGES[k]; prog((k + 0.5) / STAGES.length, s[1]);
      k++; later(next, 900);
    })();
  }
  function built(){
    if (!S.paid) meter("used");
    $("#ws-body").appendChild(el("div", "actions", '<button type="button" class="btn primary" id="see">Review the lesson</button>'));
    $("#see").addEventListener("click", review);
  }

  // ---------- 3 · review ----------
  var DETAIL = { obj:["Read the opening scene aloud","Learn six new words"], steps:["Warm-up (5 min)","New words (15 min)","Paired reading (15 min)","Check (5 min)"], ex:"Use “dentist” in a sentence." };
  var EXTRA = { support:[["Extra support",["Model the first answer aloud","Word bank on the board","Sentence starters"]]],
    mixed:[["For students who are behind",["Pair with a confident reader","Answer 3 of the 5 questions"]],["For students who are ahead",["Write a question for a partner","Retell the scene in 4 sentences"]]],
    stretch:[["Stretch",["Why did the writer choose this ending?","Continue the scene as a dialogue"]]] };
  var CHANGES = ["Shorter activities","More speaking practice","Simpler language","Add homework"];
  function list(a){ return "<ul>" + a.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
  function review(){
    mark("3"); screen("review"); if (!S.paid) meter("used");
    var doc = '<div class="box doc">' +
      (S.version > 1 ? '<div class="changed"><b>Version ' + S.version + '</b> · changed: ' + esc(S.changes.join(", ")) + '<br>You can change any lesson we build like this, as many times as you need.</div>' : "") +
      '<div class="mono muted">UNIT 1 · DAY 1 · ' + S.tt.minutes + ' MIN · ' + esc(LEVELS[S.level].t.toUpperCase()) + '</div>' +
      '<h2 id="rv-title" style="margin-top:4px">' + esc(FIRST[0]) + '</h2><div class="small">' + esc(FIRST[1]) + ' · ' + esc(FIRST[2]) + ' · ' + esc(BOOK.title) + ', ' + esc(BOOK.grade) + '</div>' +
      '<div class="ph" style="height:140px;margin-top:14px"><span>Lesson page preview</span></div>' +
      '<h4>Objectives</h4>' + list(DETAIL.obj) + '<h4>In class</h4>' + list(DETAIL.steps) +
      '<h4>Worked exercise</h4><p style="margin:0">' + esc(DETAIL.ex) + '</p>' +
      (EXTRA[S.level] || []).map(function(b){ return "<h4>" + b[0] + "</h4>" + list(b[1]); }).join("") + '</div>';
    var panel = '<div class="box" id="rv-panel"><h3>Does this lesson look right?</h3>' +
      '<p class="small" style="margin:6px 0 0">Every lesson we build for this book will follow this one’s format, level and length.</p>' +

      '<div id="rv-form" hidden><div class="sublabel" style="margin-top:16px">What should change?</div><div class="chk">' +
      CHANGES.map(function(c, i){ return '<label><input type="checkbox" value="' + esc(c) + '" id="ch' + i + '"> ' + esc(c) + '</label>'; }).join("") +
      '</div><div class="field" style="margin-top:10px"><label for="rv-note">Anything else?</label><textarea id="rv-note" rows="3" placeholder="e.g. use examples from village life"></textarea><span class="err" hidden></span></div>' +
      '<div class="actions" style="justify-content:flex-start"><button type="button" class="btn primary" id="rv-redo">Rewrite the lesson</button></div></div></div>';
    $("#review").innerHTML = '<div class="rv">' + doc + panel + '</div>';
    $("#rv-ok").addEventListener("click", approve);
    $("#rv-change").addEventListener("click", function(){ $("#rv-form").hidden = false; $("#ch0").focus(); });
    $("#rv-redo").addEventListener("click", rewrite);
  }
  function rewrite(){
    var picked = [].filter.call(document.querySelectorAll(".chk input"), function(c){ return c.checked; }).map(function(c){ return c.value; });
    var note = $("#rv-note").value.trim(), w = $("#rv-note").closest(".field"), e = w.querySelector(".err");
    if (note) picked.push("“" + note + "”");
    w.classList.toggle("bad", !picked.length); e.hidden = !!picked.length; e.textContent = "Tick at least one change or write one";
    if (!picked.length) return;
    S.changes = picked; S.version++;
    $("#rv-panel").innerHTML = '<h3>Rewriting…</h3><div class="progress" style="margin-top:12px"><i id="rw"></i></div><p class="small">Applying: ' + esc(picked.join(", ")) + '</p>';
    var p = 0; (function t(){ p += 0.25; $("#rw").style.width = Math.min(1, p) * 100 + "%"; if (p < 1) later(t, 350); else later(review, 300); })();
  }
  function approve(){
    S.approved = true;
    if (S.paid) fullBuild(); else unlock();
  }

  // ---------- account + card helpers ----------
  function field(id, label, type, ac){ return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" autocomplete="' + ac + '"><span class="err" hidden></span></div>'; }
  function check(rules){
    var ok = true;
    rules.forEach(function(r){ var f = $("#" + r[0]), w = f.closest(".field"), good = r[1](f.value.trim()), e = w.querySelector(".err"); w.classList.toggle("bad", !good); e.hidden = good; e.textContent = r[2]; if (!good && ok){ f.focus(); ok = false; } });
    return ok;
  }
  // ---------- 4 · unlock (free users only) ----------
  function unlock(){
    if (S.paid){ setWho("free"); }
    mark("4"); screen("unlock"); meter("used");
    var b = budget();
    $("#unlock").innerHTML =
      '<div class="savebar" style="margin:0 0 16px"><div style="flex:1"><b>Your free lesson is approved</b><div class="small">Saved to ' + esc(S.org || "your account") + '.</div></div>' +
      '<button type="button" class="btn" id="dl">Download PDF</button></div>' +
      '<div class="grid2">' +
      '<div class="box" style="margin:0"><h2>Build the rest of the book</h2>' +
        '<p>Your timetable gives <b>' + b.periods + ' lessons a year</b> for ' + esc(BOOK.title.split(" (")[0]) + '. We’ll build the other <b>' + (b.periods - 1) + '</b>, all following the lesson you approved (' + S.tt.minutes + ' min, ' + LEVELS[S.level].t.toLowerCase() + ').</p>' +
        '<div class="box" style="border-width:2px;border-color:var(--ink)"><div class="small">Organisation plan</div><div style="font-size:24px;font-weight:600">Price TBD</div><ul><li>Every lesson for this book</li><li>Any other textbook</li><li>Audio and sending to teachers on WhatsApp</li></ul></div></div>' +
      '<form class="box" id="pay" novalidate style="margin:0"><h3>Pay by card</h3><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">' +
        field("c-name", "Name on card", "text", "cc-name") + field("c-num", "Card number", "text", "cc-number") +
        '<div class="grid2">' + field("c-exp", "Expiry (MM/YY)", "text", "cc-exp") + field("c-cvc", "CVC", "text", "cc-csc") + '</div>' +
        '<button type="submit" class="btn primary">Pay and build the book</button><div class="small">Prototype: nothing is charged.</div></div></form></div>';
    $("#dl").addEventListener("click", function(){ this.disabled = true; this.textContent = "PDF downloaded"; });
    $("#pay").addEventListener("submit", function(e){
      e.preventDefault();
      if (!check([["c-name", function(v){ return v.length > 1; }, "Enter the name on the card"], ["c-num", function(v){ return v.replace(/\D/g, "").length >= 12; }, "Enter a valid card number"], ["c-exp", function(v){ return /^\d{2}\s*\/\s*\d{2}$/.test(v); }, "Use MM/YY"], ["c-cvc", function(v){ return /^\d{3,4}$/.test(v); }, "3 or 4 digits"]])) return;
      setWho("paid"); fullBuild();
    });
  }

  // ---------- 5 · build the rest of the book (paid only) ----------
  function fullBuild(){
    mark("5"); screen("unlock");
    var b = budget(), sum = UNITS.reduce(function(a, u){ return a + u.days; }, 0), left = b.periods;
    var counts = UNITS.map(function(u, i){ var n = i === UNITS.length - 1 ? left : Math.round(b.periods * u.days / sum); left -= n; return n; });
    $("#unlock").innerHTML = '<div class="box"><h2>Building ' + esc(BOOK.title.split(" (")[0]) + '</h2>' +
      '<div class="small">' + b.periods + ' lessons · ' + S.tt.minutes + ' min · ' + esc(LEVELS[S.level].t) + ' · following your approved lesson' + (S.version > 1 ? " (version " + S.version + ")" : "") + '</div>' +
      '<div class="sum" id="tot"></div>' +
      '<div class="small" style="margin-top:12px">We’ll email you as each unit is ready. You can leave this page.</div>' +
      '<div id="rows" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>' +
      '<div class="actions" style="justify-content:flex-start"><button type="button" class="btn" id="add">+ Add another book</button></div></div>';
    UNITS.forEach(function(u, i){ $("#rows").appendChild(el("div", "qrow", "<div>Unit " + u.n + " · " + esc(u.t) + '</div><div class="progress"><i id="qb' + i + '"></i></div><span id="qs' + i + '"></span>')); });
    $("#add").addEventListener("click", home);
    var t = 0;
    (function tick(){
      var total = 0;
      UNITS.forEach(function(u, i){ var d = Math.max(0, Math.min(counts[i], Math.floor((t - i * 3) * counts[i] / 10))); if (i === 0) d = Math.max(d, 1); total += d; $("#qb" + i).style.width = d / counts[i] * 100 + "%"; $("#qs" + i).textContent = d + " / " + counts[i]; });
      $("#tot").innerHTML = "<b>" + total + " of " + b.periods + "</b> lessons ready";
      t++; if (total < b.periods) later(tick, 300);
    })();
  }

  // ---------- modal ----------
  var modal = $("#modal"), last = null;
  function open(h){ last = document.activeElement; $("#sheet").innerHTML = h; modal.hidden = false; var f = modal.querySelector("input, .actions button"); if (f) f.focus(); }
  function close(){ modal.hidden = true; if (last && last.focus) last.focus(); }
  $("#modal-x").addEventListener("click", close);
  modal.addEventListener("click", function(e){ if (e.target === modal || e.target.hasAttribute("data-close")) close(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !modal.hidden) close(); });

  $("#replay").addEventListener("click", function(){ if (cur !== 0) goStep(0); setTimeout(function(){ if (window.__replayIntro) window.__replayIntro(); }, 30); });

  // ---------- chat with Square: click any Square to open it; it grows out of the one you clicked ----------
  var CHAT = (function(){
    var box = $("#chat"), log = $("#chat-log"), chipsEl = $("#chat-chips"), form = $("#chat-form"), inp = $("#chat-in"), from = null, greeted = {}, busy = false;
    var CHIPS = ["How much does it cost?", "What books work?", "How long does it take?", "Can I change a lesson?"];
    var R = [
      [/price|cost|pay|paid|free|money|charge|plan\b/i, "Your first lesson plan is free. Building the rest of a book is a paid organisation plan, and we’re still finalising the price."],
      [/safe|privacy|private|data|share|secure/i, "Your book stays private to your organisation. We only use it to build your lesson plans."],
      [/change|edit|rewrite|wrong|fix|different/i, "Yes. Review any lesson and tell me what to change: shorter activities, simpler language, more speaking practice. I’ll rewrite it, and the rest of the book follows the version you approve."],
      [/timetable|period|week|holiday|exam|lessons a year/i, "I plan to your timetable: periods per week, minutes per period, school weeks minus exams and holidays. That’s how I know how many lessons your year needs."],
      [/level|difficult|mixed|support|challenge/i, "Pick follow the book, more support, mixed ability or more challenge. Mixed ability adds tasks for students who are behind and ahead in every lesson."],
      [/language|urdu|english|sindhi|arabic|translat/i, "Lesson plans come out in your book’s language, so an Urdu book gets Urdu lesson plans."],
      [/how long|time|minute|hour|fast|quick|wait/i, "The first lesson takes a few minutes. A whole book usually builds within a day, and we email you as each unit is ready."],
      [/book|pdf|format|scan|file|upload|size|mb/i, "Any textbook as a PDF, up to 200 MB. Scanned books work too, as long as the pages are readable. I read every page as an image, so pictures and page numbers survive."],
      [/who are you|your name|what are you|square/i, "I’m Square, Head of Page Truth. I read each page of your book faithfully so nothing gets lost, then my crew turns it into lesson plans."],
      [/^(hi|hello|hey|salam|assalam)/i, "Hi! What would you like to know?"],
      [/thank/i, "Anytime. I’m right here if you need me."]
    ];
    function greeting(){
      var id = STEPS[cur].id;
      if (id === "1" || id === "1b") return "Hi, I’m Square! Drop your textbook in the box and I’ll start reading. Ask me anything first.";
      if (id === "2a") return "I’m reading your table of contents right now. If a unit looks wrong, tell me or tap “Something’s not right”.";
      if (id === "2c" || id === "2d") return "Two quick questions and I can start planning. Ask if anything is unclear.";
      if (id === "2e") return "I\u2019m building your first lesson now. It takes a few minutes, and you can ask me anything meanwhile.";
      if (id === "3") return "Here’s your first lesson. Tell me what you’d change and I’ll rewrite it.";
      return "Hi, I’m Square. How can I help?";
    }
    function add(who, text){ var m = el("div", "msg " + who); m.textContent = text; log.appendChild(m); log.scrollTop = log.scrollHeight; return m; }
    function reply(q){
      busy = true; var t = el("div", "msg sq", '<span class="typing"><i></i><i></i><i></i></span>'); log.appendChild(t); log.scrollTop = log.scrollHeight;
      var a = q === "" ? greeting() : "Good question. In the full product I’d answer that properly. For now I can help with pricing, timing, which books work, languages and changing lessons.";
      if (q) for (var k = 0; k < R.length; k++) if (R[k][0].test(q)){ a = R[k][1]; break; }
      setTimeout(function(){ t.remove(); add("sq", a); busy = false; }, 650 + Math.min(900, a.length * 6));
    }
    function chips(){ chipsEl.innerHTML = ""; CHIPS.forEach(function(c){ var b = el("button", "", esc(c)); b.type = "button"; b.addEventListener("click", function(){ send(c); }); chipsEl.appendChild(b); }); }
    function send(q){ q = q.trim(); if (!q || busy) return; add("me", q); inp.value = ""; reply(q); }
    function origin(){ var r = from.getBoundingClientRect(), b = box.getBoundingClientRect(); return { x:r.left + r.width / 2 - (b.left + b.width), y:r.top + r.height / 2 - (b.top + b.height) }; }
    function open(src){
      from = src; box.hidden = false;
      var o = origin();
      box.animate([{ transform:"translate(" + o.x + "px," + o.y + "px) scale(.06)", opacity:0, borderRadius:"40px" }, { transform:"none", opacity:1, borderRadius:"20px" }],
                  { duration:reduce() ? 1 : 420, easing:"cubic-bezier(.2,.9,.25,1.05)" });
      src.animate([{ transform:"none" }, { transform:"translateY(-8px) scale(1.06)" }, { transform:"none" }], { duration:360, easing:"ease-out" });
      var id = STEPS[cur].id;
      if (!greeted[id] && !busy){ greeted[id] = true; reply(""); }   // a step-specific hello, once per step
      setTimeout(function(){ inp.focus(); }, 120);
    }
    function close(){
      if (box.hidden) return;
      var o = from && document.contains(from) && from.getBoundingClientRect().width ? origin() : { x:0, y:40 };
      var a = box.animate([{ transform:"none", opacity:1 }, { transform:"translate(" + o.x + "px," + o.y + "px) scale(.06)", opacity:0 }], { duration:reduce() ? 1 : 300, easing:"cubic-bezier(.5,0,.75,0)" });
      a.onfinish = function(){ box.hidden = true; };
    }
    function reduce(){ return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
    form.addEventListener("submit", function(e){ e.preventDefault(); send(inp.value); });
    $("#chat-x").addEventListener("click", close);
    document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !box.hidden) close(); });
    document.addEventListener("click", function(e){
      var sq = e.target.closest && e.target.closest("#host svg, #reader, #builder, .cta-buddy svg, .lpeek-sq svg");
      if (sq){ e.preventDefault(); e.stopPropagation(); if (box.hidden) open(sq); else inp.focus(); }
    }, true);
    chips();
    return { open:open, close:close };
  })();

  home();
})();
</script>
<script>
// Landing intro: a textbook drops in, opens, its pages fly out and land as a year of lesson
// plans around the headline, then the book morphs into the upload box. Afterwards the grid
// stays alive: a slow wave, the cursor lifts cells, and new pages keep leaving the upload box.
(function(){
  "use strict";
  var sec = document.querySelector(".hero-sec"); if (!sec) return;
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var col = document.getElementById("hero-col"), drop = document.getElementById("drop"), hl = document.getElementById("hl");
  var kick = document.getElementById("kick"), hp = document.getElementById("hp"), hs = document.getElementById("hs"), skip = document.getElementById("skip");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var N = 150, END = 4000, SLOW = 1.35,   // SLOW stretches the whole intro evenly (1 = original pace)
     KICK = kick.textContent, INK = "#0E2058", ACC = "#F06E42";
  var W = 0, H = 0, ex, dz, bc, cells = [], parts = [], live = [], anims = [], timers = [];
  var t0 = performance.now(), laid = false, finished = false, mouse = { x:-1e4, y:-1e4 }, nextLive = 0;

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function eio(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  function back(p){ var c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seeded(s){ return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  // headline: one masked span per word, and an underline under "year"
  var words = hl.textContent.trim().split(/\s+/);
  hl.innerHTML = words.map(function(w){ return '<span class="w"><span>' + w + "</span></span>"; }).join(" ");
  var wordEls = [].slice.call(hl.querySelectorAll(".w > span"));
  var yi = words.indexOf("year"), ul = null;
  if (yi >= 0){ ul = document.createElement("i"); ul.className = "ul"; hl.querySelectorAll(".w")[yi].appendChild(ul); }

  function layout(){
    var r = sec.getBoundingClientRect(); if (!r.width || !r.height) return false;
    W = r.width; H = r.height;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    function rel(el){ var b = el.getBoundingClientRect(); return { x:b.left - r.left, y:b.top - r.top, w:b.width, h:b.height }; }
    var c = rel(col); ex = { x:c.x - 26, y:c.y - 26, w:c.w + 52, h:c.h + 52 };
    dz = rel(drop); var h = rel(hl); bc = { x:h.x + h.w / 2, y:h.y + h.h / 2 };
    var S = W < 640 ? 18 : 24, cols = Math.floor(W / S), rows = Math.floor(H / S);
    var ox = (W - (cols - 1) * S) / 2, oy = (H - (rows - 1) * S) / 2;
    cells = [];
    for (var i = 0; i < rows; i++) for (var j = 0; j < cols; j++){
      var x = ox + j * S, y = oy + i * S;
      if (x > ex.x && x < ex.x + ex.w && y > ex.y && y < ex.y + ex.h) continue;
      var dx = x - bc.x, dy = y - bc.y;
      cells.push({ x:x, y:y, d:Math.sqrt(dx * dx + dy * dy), a:Math.atan2(dy, dx), tg:false, ft:0 });
    }
    // targets: a dotted halo of N cells hugging the text block, landed in a clockwise sweep
    var R = seeded(11);
    function edge(c){ var dx = Math.max(ex.x - c.x, 0, c.x - ex.x - ex.w), dy = Math.max(ex.y - c.y, 0, c.y - ex.y - ex.h); return dx * dx + dy * dy; }
    var pool = cells.slice().sort(function(a, b){ return edge(a) - edge(b); }).slice(0, Math.min(cells.length, N * 4));
    for (var k = pool.length - 1; k > 0; k--){ var m = Math.floor(R() * (k + 1)), t = pool[k]; pool[k] = pool[m]; pool[m] = t; }
    var tg = pool.slice(0, N);   // shuffled, so pages burst out in every direction at once
    tg.forEach(function(c){ c.tg = true; });
    parts = tg.map(function(c, i){
      return { c:c, st:1150 + i * (700 / tg.length), du:750 + R() * 350, sx:bc.x + (R() - .5) * 70, sy:bc.y + (R() - .5) * 40,
               bend:(R() < .5 ? -1 : 1) * (110 + R() * 230), r0:(R() - .5) * 9 };
    });
    laid = true; return true;
  }

  function rect(x, y, w, h, fill, stroke){ ctx.beginPath(); ctx.rect(x, y, w, h); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.stroke(); } }
  function bez(p, a, b, c){ var q = 1 - p; return q * q * a + 2 * q * p * b + p * p * c; }
  function flyPos(pt, p){
    var ex2 = pt.c.x - pt.sx, ey2 = pt.c.y - pt.sy, len = Math.sqrt(ex2 * ex2 + ey2 * ey2) || 1;
    var mx = (pt.sx + pt.c.x) / 2 - ey2 / len * pt.bend, my = (pt.sy + pt.c.y) / 2 + ex2 / len * pt.bend;
    return { x:bez(p, pt.sx, mx, pt.c.x), y:bez(p, pt.sy, my, pt.c.y) };
  }
  function drawPage(x, y, w, h, rot, a, lines){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
    rect(-w / 2, -h / 2, w, h, "#fff", true);
    if (lines){ ctx.beginPath(); for (var i = 0; i < 3; i++){ var ly = -h / 2 + h * (.3 + i * .2); ctx.moveTo(-w / 2 + w * .2, ly); ctx.lineTo(w / 2 - w * (i === 2 ? .45 : .2), ly); } ctx.stroke(); }
    ctx.restore();
  }

  function drawBook(T){
    if (T > 3150) return;
    var w = 96, h = 128, sIn = back(clamp(T / 650)), open = eio(clamp((T - 650) / 520)), morph = eio(clamp((T - 2250) / 700));
    ctx.lineWidth = 2; ctx.strokeStyle = INK;
    if (morph > 0){
      var bx = bc.x - w, by = bc.y - h / 2, bw = w * 2, bh = h;
      var x = lerp(bx, dz.x, morph), y = lerp(by, dz.y, morph), rw = lerp(bw, dz.w, morph), rh = lerp(bh, dz.h, morph);
      ctx.globalAlpha = 1 - clamp((T - 2950) / 200);
      ctx.save(); ctx.setLineDash([6, 6]); ctx.lineDashOffset = -T * 0.05;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, rw, rh, 16 * morph); else ctx.rect(x, y, rw, rh);
      ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke(); ctx.restore();
      var sh = rh * (1 - morph);                                   // the spine shrinks away
      ctx.beginPath(); ctx.moveTo(x + rw / 2, y + (rh - sh) / 2); ctx.lineTo(x + rw / 2, y + (rh + sh) / 2); ctx.stroke();
      ctx.globalAlpha = 1; return;
    }
    ctx.save(); ctx.translate(bc.x, bc.y); ctx.scale(sIn, sIn); ctx.rotate((1 - clamp(T / 650)) * -0.35);
    var sx = -w / 2 * (1 - open);
    // pulses from the open book while pages leave
    if (T > 1100 && T < 2600){
      for (var k = 0; k < 3; k++){
        var rr = ((T - 1100) / 650 + k / 3) % 1;
        ctx.globalAlpha = (1 - rr) * .22 * clamp((2600 - T) / 300); ctx.beginPath(); ctx.arc(sx, 0, 70 + rr * 190, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    rect(sx, -h / 2, w, h, "#fff", true);                         // right page (the book's back)
    if (open > .3){ ctx.save(); ctx.globalAlpha = clamp((open - .3) * 2); ctx.lineWidth = 1.5; ctx.beginPath();
      for (var i = 0; i < 6; i++){ var ly = -h / 2 + 22 + i * 16; ctx.moveTo(sx + 14, ly); ctx.lineTo(sx + w - (i % 3 === 2 ? 40 : 14), ly); } ctx.stroke(); ctx.restore(); }
    // flutter: pages flipping over while the crew works
    if (T > 1150 && T < 2400){
      var ph = ((T - 1150) % 180) / 180, th = ph * Math.PI, fw = w * Math.cos(th), sk = Math.sin(th) * 16;
      ctx.beginPath(); ctx.moveTo(sx, -h / 2); ctx.lineTo(sx + fw, -h / 2 - sk); ctx.lineTo(sx + fw, h / 2 + sk); ctx.lineTo(sx, h / 2); ctx.closePath();
      ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke();
    }
    // the cover swinging open, with a little perspective
    var th2 = open * Math.PI, cw = w * Math.cos(th2), sk2 = Math.sin(th2) * 16;
    ctx.beginPath(); ctx.moveTo(sx, -h / 2); ctx.lineTo(sx + cw, -h / 2 - sk2); ctx.lineTo(sx + cw, h / 2 + sk2); ctx.lineTo(sx, h / 2); ctx.closePath();
    ctx.fillStyle = open < .5 ? INK : "#fff"; ctx.fill(); ctx.stroke();
    if (open < .5){ ctx.fillStyle = "#fff"; var cf = Math.cos(th2);
      ctx.fillRect(sx + cw * .18, -h / 2 + 24, cw * .64 * (cf > 0 ? 1 : 0), 10); ctx.fillRect(sx + cw * .18, -h / 2 + 42, cw * .4 * (cf > 0 ? 1 : 0), 6); }
    else { ctx.save(); ctx.globalAlpha = clamp((open - .5) * 2); ctx.lineWidth = 1.5; ctx.beginPath();
      for (var j = 0; j < 6; j++){ var ly2 = -h / 2 + 22 + j * 16; ctx.moveTo(sx + cw + 14, ly2); ctx.lineTo(sx - 14 - (j % 3 === 1 ? 26 : 0), ly2); } ctx.stroke(); ctx.restore(); }
    ctx.restore();
  }

  function frame(now){
    requestAnimationFrame(frame);
    if (sec.hidden){ laid = false; return; }
    if (!laid && !layout()) return;
    if (typeof window.__introT === "number"){ t0 = now - window.__introT; anims.forEach(function(x){ x.pause(); x.currentTime = window.__introT; }); }   // review hook: freeze at a moment
    var T = (now - t0) / SLOW, intro = T < END, sz = W < 640 ? 6 : 7;
    ctx.clearRect(0, 0, W, H); ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 1;
    var rip = (T - 650) * 1.25, pulse = (T - 2700) * 1.9, landed = 0;
    for (var i = 0; i < cells.length; i++){
      var c = cells[i], a = clamp((rip - c.d) / 240); if (a <= 0) continue;
      var s = sz, al = .13 * a;
      if (!intro && !reduce){ var wv = Math.sin(now * .0016 - c.d * .016); al += .05 * wv; s *= 1 + .14 * wv; }
      if (pulse > 0){ var pk = Math.max(0, 1 - Math.abs(c.d - pulse) / 70); al += .4 * pk; s *= 1 + .8 * pk; }
      var mx = c.x - mouse.x, my = c.y - mouse.y, md = mx * mx + my * my;
      if (md < 19600){ var mk = 1 - Math.sqrt(md) / 140; s *= 1 + mk * 1.4; al += mk * .4; }
      if (c.ft){ var f = 1 - (now - c.ft) / 3200; if (f > 0){ ctx.globalAlpha = Math.min(1, al + .6 * f); ctx.fillStyle = ACC; ctx.fillRect(c.x - s / 2, c.y - s / 2, s, s); ctx.fillStyle = INK; continue; } c.ft = 0; }
      if (c.tg) continue;
      ctx.globalAlpha = Math.min(1, al); ctx.strokeRect(c.x - s / 2, c.y - s / 2, s, s);
    }
    // the year of lesson plans: pages in flight, then landed cells
    for (var k = 0; k < parts.length; k++){
      var pt = parts[k], L = pt.st + pt.du, cc = pt.c;
      if (T >= L){
        landed++;
        var pp = clamp((T - L) / 380), ps = sz * (1 + 1.1 * (1 - eo(pp)));
        if (!intro && !reduce){ ps *= 1 + .1 * Math.sin(now * .0016 - cc.d * .016); }
        var qx = cc.x - mouse.x, qy = cc.y - mouse.y, qd = qx * qx + qy * qy; if (qd < 19600) ps *= 1 + (1 - Math.sqrt(qd) / 140) * 1.2;
        ctx.globalAlpha = .88; ctx.fillRect(cc.x - ps / 2, cc.y - ps / 2, ps, ps);
        if (pp < 1){ ctx.globalAlpha = (1 - pp) * .6; var rg = 4 + pp * 18; ctx.strokeStyle = ACC; ctx.strokeRect(cc.x - rg, cc.y - rg, rg * 2, rg * 2); ctx.strokeStyle = INK; }
      } else {
        ctx.globalAlpha = .1 * clamp((rip - cc.d) / 240); ctx.strokeRect(cc.x - sz / 2, cc.y - sz / 2, sz, sz);
        if (T >= pt.st){
          var p = eio((T - pt.st) / pt.du), pos = flyPos(pt, p), tr = flyPos(pt, Math.max(0, p - .08));
          ctx.globalAlpha = .22 * (1 - p); ctx.beginPath(); ctx.moveTo(tr.x, tr.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
          drawPage(pos.x, pos.y, lerp(14, sz, p), lerp(18, sz, p), pt.r0 * (1 - p) + Math.sin(p * Math.PI) * 1.5, clamp(p * 8), p < .55);
        }
      }
    }
    ctx.globalAlpha = 1;
    drawBook(T);
    // running count under the book while pages fly
    if (T > 1150 && T < 2700){
      ctx.globalAlpha = clamp((T - 1150) / 200) * (1 - clamp((T - 2350) / 300));
      ctx.font = "600 13px 'JetBrains Mono', ui-monospace, Menlo, monospace"; ctx.textAlign = "center"; ctx.fillStyle = INK;
      var lbl = "1 BOOK → " + landed + " LESSON PLANS", lw = ctx.measureText(lbl).width + 28, ly = bc.y + 64 + 44;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bc.x - lw / 2, ly - 20, lw, 30, 15); else ctx.rect(bc.x - lw / 2, ly - 20, lw, 30);
      ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.fillText(lbl, bc.x, ly);
      ctx.globalAlpha = 1;
    }
    // afterwards: new pages keep leaving the upload box and landing somewhere in the grid
    if (!intro && !reduce){
      if (now > nextLive && cells.length){
        nextLive = now + 650;
        var tc = cells[Math.floor(Math.random() * cells.length)];
        if (!tc.tg) live.push({ c:tc, st:now, du:1100, sx:dz.x + dz.w * (.2 + Math.random() * .6), sy:dz.y, bend:(Math.random() < .5 ? -1 : 1) * (60 + Math.random() * 160), r0:(Math.random() - .5) * 6 });
      }
      for (var n = live.length - 1; n >= 0; n--){
        var lp = live[n], q = (now - lp.st) / lp.du;
        if (q >= 1){ lp.c.ft = now; live.splice(n, 1); continue; }
        var e = eio(q), lpos = flyPos(lp, e);
        drawPage(lpos.x, lpos.y, lerp(11, sz, e), lerp(14, sz, e), lp.r0 * (1 - e), clamp(q * 6) * .9, e < .5);
      }
    }
  }


  // ---------- Host peeks up from behind the upload box once the intro is done; eyes follow the cursor ----------
  var HOST = (function(){
    var host = document.getElementById("host"), hands = document.getElementById("host-hands");
    var mx = null, my = null, raf = 0, blinkT = 0, up = false;
    function aim(){
      raf = 0;
      [].forEach.call(document.querySelectorAll("#host .eye"), function(e){
        var el = e.querySelector(".anchor"), r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = mx == null ? 0 : mx - cx, dy = my == null ? 0 : my - cy, d = Math.sqrt(dx * dx + dy * dy) || 1, k = Math.min(4.2, d / 25);
        e.querySelector(".pupil").setAttribute("transform", "translate(" + (dx / d * k).toFixed(2) + "," + (dy / d * k * .9).toFixed(2) + ")");
      });
    }
    function look(x, y){ mx = x; my = y; if (!raf) raf = requestAnimationFrame(aim); }
    document.addEventListener("mousemove", function(e){ look(e.clientX, e.clientY); });
    document.addEventListener("mouseleave", function(){ look(null, null); });
    document.addEventListener("touchstart", function(e){ var t = e.touches[0]; if (t) look(t.clientX, t.clientY); }, { passive:true });
    function blink(){ clearTimeout(blinkT); if (!up) return; host.classList.add("blink"); setTimeout(function(){ host.classList.remove("blink"); }, 130); blinkT = setTimeout(blink, 2400 + Math.random() * 2800); }
    drop.addEventListener("mouseenter", function(){ if (up) host.classList.add("hi"); });
    drop.addEventListener("mouseleave", function(){ host.classList.remove("hi"); });
    return {
      show:function(delay){ setTimeout(function(){ up = true; host.classList.add("up"); hands.classList.add("up"); blinkT = setTimeout(blink, 1400); aim(); }, delay || 0); },
      hide:function(){ up = false; clearTimeout(blinkT); host.classList.remove("up", "hi", "blink"); hands.classList.remove("up"); }
    };
  })();
  function A(el, kf, delay, dur, ease){ var a = el.animate(kf, { delay:delay * SLOW, duration:dur * SLOW, easing:ease || "cubic-bezier(.2,.8,.2,1)", fill:"both" }); anims.push(a); return a; }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function scramble(delay){
    var CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*+=";
    kick.textContent = "";
    later(function(){
      var s0 = performance.now();
      (function tick(){
        if (finished){ kick.textContent = KICK; return; }
        var p = clamp((performance.now() - s0) / (650 * SLOW)), n = Math.floor(p * KICK.length);
        kick.textContent = KICK.slice(0, n) + KICK.slice(n).replace(/\S/g, function(){ return CH[Math.floor(Math.random() * CH.length)]; });
        if (p < 1) requestAnimationFrame(tick); else kick.textContent = KICK;
      })();
    }, delay * SLOW);
  }
  function finish(){
    if (finished) return;
    finished = true; t0 = Math.min(t0, performance.now() - END * SLOW - 1);
    anims.forEach(function(a){ a.finish(); }); timers.forEach(clearTimeout); timers = [];
    kick.textContent = KICK; skip.hidden = true; drop.style.pointerEvents = ""; sec.classList.remove("intro");
    HOST.show(reduce ? 0 : 450);
  }
  function play(){
    anims.forEach(function(a){ a.cancel(); }); anims = []; timers.forEach(clearTimeout); timers = [];
    HOST.hide(); finished = false; t0 = performance.now(); live = []; cells.forEach(function(c){ c.ft = 0; }); laid = false;
    sec.classList.add("intro"); drop.style.pointerEvents = "none"; skip.hidden = false;
    wordEls.forEach(function(w, i){ A(w, [{ transform:"translateY(115%) rotate(7deg)" }, { transform:"none" }], 2350 + i * 70, 850); });
    if (ul) A(ul, [{ transform:"scaleX(0)" }, { transform:"scaleX(1)" }], 3100, 650);
    A(kick, [{ opacity:0 }, { opacity:1 }], 2150, 200, "linear"); scramble(2150);
    A(hp, [{ opacity:0, transform:"translateY(14px)" }, { opacity:1, transform:"none" }], 2950, 650);
    A(drop, [{ opacity:0 }, { opacity:1 }], 2900, 220, "linear");
    A(hs, [{ opacity:0, transform:"translateY(8px)" }, { opacity:1, transform:"none" }], 3250, 550);
    A(skip, [{ opacity:0 }, { opacity:1 }], 400, 300, "linear");
    later(finish, END * SLOW);
    if (reduce) finish();
  }

  sec.addEventListener("mousemove", function(e){ var r = sec.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
  sec.addEventListener("mouseleave", function(){ mouse.x = mouse.y = -1e4; });
  sec.addEventListener("click", function(){ if (!finished) finish(); });
  skip.addEventListener("click", function(e){ e.stopPropagation(); finish(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !finished) finish(); });
  window.addEventListener("resize", function(){ laid = false; });
  window.__replayIntro = function(){ play(); };

  play();
  requestAnimationFrame(frame);
})();
</script>
